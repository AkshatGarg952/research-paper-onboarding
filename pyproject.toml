[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-onboarding"
version = "0.1.0"
description = "Calyb AI Domain B: Research Paper Onboarding & Reading Path Generation for RAG (2017-2024)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
onboard = "research_onboarding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
